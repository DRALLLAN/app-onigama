<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Onigama Trading</title>
    <meta name="description" content="Onigama FX Telegram Mini App - Gold signals, market analysis, and trading journal." />
    <meta property="og:title" content="Onigama Trading" />
    <meta property="og:description" content="Onigama FX Telegram Mini App - Gold signals, market analysis, and trading journal." />
    
    <!-- PWA Config & Favicons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />
    
    <!-- mobile device status & navigation bar edge-to-edge theme integration -->
    <meta name="theme-color" content="#070f17" />
    <meta name="navigation-bar-color" content="#070f17" />
    <meta name="msapplication-navbutton-color" content="#070f17" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Register PWA Service Worker -->
    <script>
      // Capture beforeinstallprompt globally to prevent missing the event
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
        // Dispatch custom event to notify React components
        window.dispatchEvent(new CustomEvent('onigamapwaprompt'));
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('Onigama PWA ServiceWorker registered successfully:', registration.scope);
            })
            .catch((error) => {
              console.log('Onigama PWA ServiceWorker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
