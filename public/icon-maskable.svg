<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Maskable PWA Icon with extra padding on contents to prevent clipping -->
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141a29" />
      <stop offset="100%" stop-color="#070a12" />
    </radialGradient>
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe699" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="hyperGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background covering 100% of the canvas area -->
  <rect width="100%" height="100%" fill="url(#bgGlow)"/>
  
  <!-- Scale down core content to 80% to fit the safe zone -->
  <g transform="translate(51.2, 51.2) scale(0.8)">
    <circle cx="256" cy="256" r="210" stroke="url(#goldMetallic)" stroke-width="2" fill="none" opacity="0.18" />
    <circle cx="256" cy="256" r="185" stroke="url(#cyberCyan)" stroke-width="1.5" stroke-dasharray="10 15" fill="none" opacity="0.25" />
    
    <g filter="url(#hyperGlow)">
      <path d="M256 90 L390 145 C390 280 340 370 256 420 C172 370 122 280 122 145 Z" fill="none" stroke="url(#goldMetallic)" stroke-width="10" stroke-linejoin="round" />
      <path d="M256 94 L380 148 C380 270 332 355 256 408 C180 355 132 270 132 148 Z" fill="#0c111d" opacity="0.85" />
      
      <line x1="210" y1="180" x2="210" y2="340" stroke="#059669" stroke-width="2" opacity="0.4" />
      <rect x="202" y="210" width="16" height="80" rx="2" fill="#059669" opacity="0.5" />
      <line x1="302" y1="140" x2="302" y2="310" stroke="#dc2626" stroke-width="2" opacity="0.4" />
      <rect x="294" y="170" width="16" height="90" rx="2" fill="#dc2626" opacity="0.5" />
      
      <path d="M 160 330 Q 220 310 256 240 T 350 160" fill="none" stroke="url(#goldMetallic)" stroke-width="6" stroke-linecap="round" />
      <circle cx="350" cy="160" r="8" fill="#ffe699" filter="url(#hyperGlow)" />

      <path d="M190 220 C185 280 215 320 256 320 C297 320 327 280 322 220 C302 245 282 250 256 250 C230 250 210 245 190 220 Z" fill="url(#goldMetallic)" />
      <path d="M256 182 L275 220 L300 210 L285 242 L320 255 L270 268 L256 310 L242 268 L192 255 L227 242 L212 210 L237 220 Z" fill="#111827" />
    </g>

    <text x="256" y="465" fill="url(#goldMetallic)" font-family="'Inter', sans-serif" font-weight="900" font-size="28" letter-spacing="4" text-anchor="middle" opacity="0.95">ONIGAMA</text>
  </g>
</svg>
